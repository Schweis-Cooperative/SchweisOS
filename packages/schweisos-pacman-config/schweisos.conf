# This file is owned by schweisos-pacman-config.
#
# To make this future repository visible, include this file from pacman.conf:
#
# Include = /etc/pacman.d/schweisos.conf
#
# schweisos-pacman-config does not edit /etc/pacman.conf automatically.
# No production mirror exists during bootstrap. The included mirrorlist provides
# a local development bootstrap endpoint that remains fail-closed until signed
# SchweisOS repository artifacts and approved public keys exist.
# Arch repository definitions remain in Arch-owned config.

[schweisos]
SigLevel = Required TrustedOnly
Include = /etc/pacman.d/schweisos-mirrorlist
