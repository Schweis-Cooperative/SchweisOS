mode: optionalmultiple
method: legacy

labels:
  step: "Optional Features"
  step[tr]: "İsteğe Bağlı Özellikler"

items:
  - id: privacy
    name: "Privacy"
    description: "torbrowser-launcher — installs and verifies Tor Browser through its upstream launcher after installation. Network access is required for the browser download."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: security
    name: "Security"
    description: "firewalld and plasma-firewall — provide a maintained firewall service and Plasma configuration interface."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: gaming
    name: "Gaming"
    description: "gamemode, MangoHud, and Lutris — provide per-game performance requests, metrics, and game-library integration without hidden tuning."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: development
    name: "Development"
    description: "Git, CMake, and Ninja — provide common source-control and native build tools while leaving language toolchains to the developer."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: virtualization
    name: "Virtualization"
    description: "QEMU Desktop and Virtual Machine Manager — provide KVM/QEMU virtual machines. Hardware virtualization support is still required."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: multimedia
    name: "Multimedia"
    description: "VLC — provides a widely compatible local media player from the official Arch repositories."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: office
    name: "Office"
    description: "LibreOffice Fresh — provides word processing, spreadsheets, presentations, and document interoperability."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: fonts
    name: "International Fonts"
    description: "Noto core, CJK, and emoji fonts — improve multilingual document and web coverage without replacing the default UI font."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: printing
    name: "Printing"
    description: "CUPS and system-config-printer — provide local and network printer support and a graphical configuration tool."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: bluetooth
    name: "Bluetooth"
    description: "BlueZ and its utilities — provide the standard Linux Bluetooth stack and diagnostic command-line tools."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: accessibility
    name: "Accessibility"
    description: "Orca and Speech Dispatcher — provide screen-reader and speech services for users who need them."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: wayland-tools
    name: "Wayland Tools"
    description: "wayland-utils — provides protocol and compositor diagnostics for the default modern display stack."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: power-management
    name: "Power Management"
    description: "power-profiles-daemon — exposes supported platform power profiles to Plasma without applying undocumented tuning."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: network-tools
    name: "Network Tools"
    description: "OpenSSH and rsync — provide secure remote access, file transfer, backup, and recovery workflows."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: containers
    name: "Containers"
    description: "Distrobox and rootless Podman — provide compatibility environments. Distrobox is not presented as a security sandbox."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: diagnostics
    name: "Storage Diagnostics"
    description: "smartmontools and nvme-cli — expose drive health and NVMe diagnostics without background telemetry."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: recovery
    name: "Recovery Tools"
    description: "GParted and TestDisk — provide partition repair and data-recovery tools. Use them carefully and keep backups."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: maintenance
    name: "Maintenance Tools"
    description: "pacman-contrib and Reflector — provide supported package-cache, mirror, and maintenance utilities without automatic hidden changes."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
