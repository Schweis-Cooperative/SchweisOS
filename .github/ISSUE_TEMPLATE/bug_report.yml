name: Bug report
description: Report a reproducible SchweisOS problem.
title: "bug: "
labels:
  - "type: bug"
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide exact steps where possible.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documentation
        - Architecture
        - ISO
        - Installer
        - Packaging
        - KDE Plasma
        - Gaming
        - Flatpak
        - AUR
        - Distrobox
        - Security
        - Release engineering
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include ISO/build version, hardware or VM details, and relevant logs.
    validations:
      required: false
