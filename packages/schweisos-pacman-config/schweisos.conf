################################################################################
######################## SchweisOS pacman repositories ##########################
################################################################################

# This file is owned by schweisos-pacman-config.
#
# To enable SchweisOS repositories, include this file from /etc/pacman.conf:
#
# Include = /etc/pacman.d/schweisos.conf
#
# schweisos-pacman-config does not edit /etc/pacman.conf automatically.
# It configures only SchweisOS-owned repositories and must not duplicate Arch
# Linux repository definitions.
#
# Trust model:
# - SchweisOS package trust is provided by schweisos-keyring.
# - Repository discovery is provided by schweisos-mirrorlist.
# - Mirrors distribute signed artifacts; they are not trust anchors.
# - Do not use TrustAll for official SchweisOS repositories.

[schweisos]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/schweisos-mirrorlist

