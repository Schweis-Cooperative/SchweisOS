efi:
  mountPoint: "/boot"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "SchweisOS"

defaultFileSystemType: "ext4"
availableFileSystemTypes:
  - "ext4"
  - "btrfs"

userSwapChoices:
  - none
  - file
  - small
initialSwapChoice: file
drawNestedPartitions: true

defaultPartitionTableType: gpt
requiredPartitionTableType: gpt

# Encryption and LVM require different initramfs and recovery contracts. They
# remain unavailable until SchweisOS implements and validates those paths.
enableLuksAutomatedPartitioning: false
lvm:
  enable: false
