mode: required
method: legacy
default: privacy

labels:
  step: "Install Profile"
  step[tr]: "Kurulum Profili"

items:
  - id: privacy
    name: "Privacy (Recommended)"
    name[tr]: "Gizlilik (Önerilen)"
    description: "A balanced desktop profile with firewall integration, X11 compatibility for legacy applications, and maintenance tools. It keeps the system practical without adding unreviewed third-party package sources."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: gaming
    name: "Gaming"
    description: "Adds GameMode, MangoHud, Lutris, X11 compatibility, and power-profile support for desktop gaming while keeping changes reversible and package-owned."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: developer
    name: "Developer"
    description: "Adds source-control, build, container, network, and diagnostic tools for software development without installing language-specific stacks by default."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: creator
    name: "Creator"
    description: "Adds multimedia playback and international font coverage for media review, documents, and multilingual content."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: office
    name: "Office"
    description: "Adds LibreOffice, printing support, international fonts, and Bluetooth utilities for a practical workstation setup."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
  - id: minimal
    name: "Minimal"
    description: "Installs only the required SchweisOS KDE desktop, Firefox, the selected kernel, and base utilities. Optional feature groups can still be added on the next page."
    screenshot: "/usr/share/schweisos/branding/schweisos.png"
