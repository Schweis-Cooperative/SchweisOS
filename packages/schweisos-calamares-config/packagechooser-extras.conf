mode: optionalmultiple
method: legacy

labels:
  step: "Additional Packages"
  step[tr]: "Ek Paketler"

items:
  - id: privacy
    name: "Privacy Tools"
    name[tr]: "Gizlilik Araçları"
    description: "Packages: torbrowser-launcher. Installs the upstream Tor Browser launcher. The launcher verifies and downloads Tor Browser after installation, so network access is required when first used."
  - id: security
    name: "Security Tools"
    name[tr]: "Güvenlik Araçları"
    description: "Packages: firewalld, plasma-firewall. Adds a maintained firewall service and the Plasma configuration interface."
  - id: gaming
    name: "Gaming Tools"
    name[tr]: "Oyun Araçları"
    description: "Packages: gamemode, mangohud, lutris. Adds per-game performance requests, metrics, and game-library integration without hidden tuning."
  - id: development
    name: "Development Tools"
    name[tr]: "Geliştirme Araçları"
    description: "Packages: git, cmake, ninja. Adds common source-control and native build tools while leaving language toolchains to the developer."
  - id: virtualization
    name: "Virtualization Tools"
    name[tr]: "Sanallaştırma Araçları"
    description: "Packages: qemu-desktop, virt-manager. Adds KVM/QEMU virtual-machine management. Hardware virtualization support is still required."
  - id: multimedia
    name: "Multimedia"
    description: "Packages: vlc. Adds a widely compatible local media player from the official Arch repositories."
  - id: office
    name: "Office Suite"
    name[tr]: "Ofis Paketi"
    description: "Packages: libreoffice-fresh. Adds word processing, spreadsheets, presentations, and document interoperability."
  - id: fonts
    name: "International Fonts"
    name[tr]: "Uluslararası Yazı Tipleri"
    description: "Packages: noto-fonts, noto-fonts-cjk, noto-fonts-emoji. Improves multilingual document and web coverage without replacing the default UI font."
  - id: printing
    name: "Printing Support"
    name[tr]: "Yazdırma Desteği"
    description: "Packages: cups, system-config-printer. Adds local and network printer support and a graphical configuration tool."
  - id: bluetooth
    name: "Bluetooth Support"
    name[tr]: "Bluetooth Desteği"
    description: "Packages: bluez, bluez-utils. Adds the standard Linux Bluetooth stack and diagnostic command-line tools."
  - id: accessibility
    name: "Accessibility"
    name[tr]: "Erişilebilirlik"
    description: "Packages: orca, speech-dispatcher. Adds screen-reader and speech services for users who need them."
  - id: wayland-tools
    name: "Wayland Tools"
    name[tr]: "Wayland Araçları"
    description: "Packages: wayland-utils. Adds protocol and compositor diagnostics for the default modern display stack."
  - id: x11-compatibility
    name: "X11 Compatibility"
    name[tr]: "X11 Uyumluluğu"
    description: "Packages: xorg-xwayland. Runs supported X11 applications inside the default Plasma Wayland session without changing the session type."
  - id: power-management
    name: "Power Management"
    name[tr]: "Güç Yönetimi"
    description: "Packages: power-profiles-daemon. Exposes supported platform power profiles to Plasma without applying undocumented tuning."
  - id: network-tools
    name: "Network Tools"
    name[tr]: "Ağ Araçları"
    description: "Packages: openssh, rsync. Adds secure remote access, file transfer, backup, and recovery workflows."
  - id: containers
    name: "Container Tools"
    name[tr]: "Konteyner Araçları"
    description: "Packages: distrobox, podman. Adds compatibility environments. Distrobox is not presented as a security sandbox."
  - id: diagnostics
    name: "Storage Diagnostics"
    name[tr]: "Depolama Tanılama"
    description: "Packages: smartmontools, nvme-cli. Exposes drive health and NVMe diagnostics without background telemetry."
  - id: recovery
    name: "Recovery Tools"
    name[tr]: "Kurtarma Araçları"
    description: "Packages: gparted, testdisk. Adds partition repair and data-recovery tools. Use them carefully and keep backups."
  - id: maintenance
    name: "Maintenance Tools"
    name[tr]: "Bakım Araçları"
    description: "Packages: pacman-contrib, reflector. Adds supported package-cache, mirror, and maintenance utilities without automatic hidden changes."
