#
# Top-level SchweisOS Calamares sequence. Configuration is packaged separately
# from Calamares itself and installed under /etc/calamares.

modules-search: [ local ]
branding: schweisos
prompt-install: false

instances:
  - id: preflight
    module: shellprocess
    config: shellprocess-preflight.conf
  - id: desktop
    module: packagechooserq
    config: packagechooser-desktop.conf
  - id: browser
    module: packagechooserq
    config: packagechooser-browser.conf
  - id: kernel
    module: packagechooserq
    config: packagechooser-kernel.conf
  - id: profile
    module: packagechooserq
    config: packagechooser-profile.conf
  - id: extras
    module: notesqml
    config: optionalfeatures.conf
  - id: reconcile
    module: shellprocess
    config: shellprocess-reconcile.conf
  - id: pacman
    module: shellprocess
    config: shellprocess-pacman.conf
  - id: systemd-boot
    module: shellprocess
    config: shellprocess-systemd-boot.conf
  - id: services
    module: shellprocess
    config: shellprocess-services.conf

sequence:
  - show:
      - welcomeq
      - keyboard
      - locale
      - partition
      - packagechooserq@desktop
      - packagechooserq@browser
      - packagechooserq@kernel
      - packagechooserq@profile
      - notesqml@extras
      - users
      - summary
  - exec:
      - shellprocess@preflight
      - partition
      - mount
      - unpackfs
      - shellprocess@reconcile
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - hwclock
      - shellprocess@pacman
      - shellprocess@systemd-boot
      - shellprocess@services
      - umount
  - show:
      - finished
