#
# Pacstrap-only pacman configuration for SchweisOS installation.
# This file is consumed by schweisos-calamares-config and must not replace the
# live or installed system's /etc/pacman.conf.
#

[options]
HoldPkg = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Required

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

Include = /etc/pacman.d/schweisos.conf
