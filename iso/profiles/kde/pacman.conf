#
# Build-time pacman configuration for the SchweisOS KDE archiso profile.
# Runtime repository integration remains package-owned.
#

[options]
HoldPkg = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Owned by schweisos-pacman-config and installed on the build host.
Include = /etc/pacman.d/schweisos.conf
