#
# Archiso-compatible entry for an outer GRUB that consumes loopback.cfg.
# A multiboot tool's mode label does not prove that this file was selected.
# This file is copied by upstream mkarchiso to /boot/grub/loopback.cfg even
# though the live ISO's native UEFI path remains systemd-boot.

# Search for the filesystem that stores the ISO file supplied by the caller.
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

default=schweisos
timeout=3
timeout_style=menu

menuentry "SchweisOS Live (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'schweisos' {
    set gfxpayload=keep
    echo 'Loading kernel...'
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" checksum=y systemd.firstboot=no quiet splash loglevel=3 systemd.show_status=auto vt.global_cursor_default=0
    echo 'Loading initramfs...'
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "SchweisOS Live (Debug) (%ARCH%, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'schweisos-debug' {
    set gfxpayload=keep
    echo 'Loading kernel...'
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" checksum=y systemd.firstboot=no loglevel=7 systemd.show_status=yes vt.global_cursor_default=1
    echo 'Loading initramfs...'
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}
